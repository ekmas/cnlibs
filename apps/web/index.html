<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>cnlibs</title>
  <meta content="A collection of small, focused libraries." name="description">
  <style>
    :root {
      --fg: #1a1a1a;
      --bg: #ffffff;
      --muted: #666666;
      --border: #e5e5e5;
      --accent: #2563eb;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f0f0f0;
        --bg: #111111;
        --muted: #999999;
        --border: #2a2a2a;
        --accent: #60a5fa;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    main {
      width: 100%;
      max-width: 40rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }

    p.tagline {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    ul.libraries {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    ul.libraries li {
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: inherit;
    }

    ul.libraries a {
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    ul.libraries a:hover {
      text-decoration: underline;
    }

    ul.libraries p {
      margin: 0.25rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <h1>cnlibs</h1>
    <p class="tagline">A collection of small, focused libraries.</p>

    <ul class="libraries">
      <li>
        <a href="https://8bit.cnlibs.com">8bit</a>
        <p>Coming soon.</p>
      </li>
      <li>
        <a href="https://ascii.cnlibs.com">ascii</a>
        <p>Coming soon.</p>
      </li>
    </ul>

    <footer>
      <a href="https://github.com/ekmas/cnlibs">Source on GitHub</a>
    </footer>
  </main>
</body>

</html>
